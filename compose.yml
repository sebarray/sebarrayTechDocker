name: sebarray-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sebarraytech

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sebarraytech" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/sebarray/sebarraytech:latest
    command: [ "/app/migrate", "up" ]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sebarraytech?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/sebarray/sebarraytech:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sebarraytech?sslmode=disable
      HTTP_ADDR: :8080
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_REGION: us-east-1
      MEDIA_BUCKET: menu-media
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  poste:
    image: analogic/poste.io:latest
    container_name: poste
    hostname: mail.sebarray.tech
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: America/Argentina/Buenos_Aires

      # Nginx del host utiliza 80 y 443.
      HTTP_PORT: "8088"
      HTTPS_PORT: "8448"

      # Para reducir el consumo de RAM.
      DISABLE_CLAMAV: "TRUE"

      # Mantener antispam y webmail.
      DISABLE_RSPAMD: "FALSE"
      DISABLE_ROUNDCUBE: "FALSE"

    volumes:
      - ./data/poste:/data

volumes:
  minio_data:
