name: sebarray-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sebarray
      POSTGRES_USER: sebarray
      POSTGRES_PASSWORD: "cambiar-esta-password-segura"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sebarray -d sebarray"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  poste:
    image: analogic/poste.io:latest
    container_name: poste
    hostname: mail.sebarray.tech
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: America/Argentina/Buenos_Aires

      # Nginx del host utiliza 80 y 443.
      HTTP_PORT: "8088"
      HTTPS_PORT: "8448"

      # Para reducir el consumo de RAM.
      DISABLE_CLAMAV: "TRUE"

      # Mantener antispam y webmail.
      DISABLE_RSPAMD: "FALSE"
      DISABLE_ROUNDCUBE: "FALSE"

    volumes:
      - ./data/poste:/data
